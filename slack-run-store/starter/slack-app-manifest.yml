# Paste this at api.slack.com/apps > Create New App > From a manifest. Generated by build.py.
display_information:
  name: Store
  description: Cards, buttons and /store for the Slack-run store
features:
  bot_user:
    display_name: Store
    always_online: false
  slash_commands:
    - command: /store
      url: https://your-n8n.example.com/webhook/store-command
      description: What's waiting, run any job, open the review page
      usage_hint: help | status | run <job> | page <queue>
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - files:write
      - commands
      - channels:history
      - groups:history
settings:
  interactivity:
    is_enabled: true
    request_url: https://your-n8n.example.com/webhook/store-slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
